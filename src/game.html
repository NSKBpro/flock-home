<title>Flock Home</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
[hidden]{display:none!important}
/*FONTS*/
/* Layout: one phone-shaped column, sky on top (nest, then the wire), the roost grid below, tools at the bottom.
   Wide screens (desktop, 16:9 portal frames): two columns, controls left and the roost right. */
:root{
  --sky-top:#172A3B; --sky-bot:#24475B; --sky-end:#1B3547;
  --panel:#1D3548; --panel-hi:#244259; --field:#12273A; --cell-dot:#2A4860;
  --ink:#F4EFE6; --muted:#9CB3C2; --line:#0A1621; --wire:#0E1C27;
  --warn:#FF8C5A; --accent:#F4C95D; --accent-ink:#2B1E04; --scrim:rgba(7,15,23,.66);
  --display:'Sniglet','Trebuchet MS',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:linear-gradient(180deg,var(--sky-top),var(--sky-bot) 55%,var(--sky-end));color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{position:relative;box-sizing:border-box;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
.stars{position:absolute;inset:0 0 auto 0;height:260px;pointer-events:none;opacity:.55;background:
  radial-gradient(1.2px 1.2px at 12% 18%,var(--ink),transparent 60%),radial-gradient(1px 1px at 33% 8%,var(--ink),transparent 60%),
  radial-gradient(1.4px 1.4px at 58% 22%,var(--ink),transparent 60%),radial-gradient(1px 1px at 72% 6%,var(--ink),transparent 60%),
  radial-gradient(1px 1px at 88% 30%,var(--ink),transparent 60%),radial-gradient(1.2px 1.2px at 46% 40%,var(--ink),transparent 60%)}
.moon{position:absolute;left:62%;top:18px;width:22px;height:22px;border-radius:50%;box-shadow:-6px 3px 0 0 #F6E7B8;opacity:.8;pointer-events:none}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px 2px;position:relative;z-index:2}
.lvl{display:flex;align-items:baseline;gap:8px;min-width:0}
.lvl small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.lvl b{font-family:var(--display);font-weight:800;font-size:30px;line-height:1}
.lvl .boss{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);padding:2px 7px;border-radius:99px;align-self:center}
.icons{display:flex;gap:8px;flex:none}
.ibtn{width:40px;height:40px;border-radius:12px;border:0;background:var(--panel);display:grid;place-items:center;cursor:pointer}
.ibtn svg{width:20px;height:20px}
.coach{font-size:13px;line-height:1.35;color:var(--muted);text-align:center;min-height:18px;margin:2px 0 8px;text-wrap:balance}
.coach b{color:var(--ink)}
.coach.tip{color:var(--ink)}
.coach.tip::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:7px;vertical-align:1px}
.waiting{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.waiting .chip{width:22px;height:22px}.waiting .chip svg{width:12px;height:12px}

.nests{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:10px;max-width:calc(var(--n,2) * 240px);width:100%;margin-inline:auto}
.slot{height:92px;position:relative}
.nest{position:absolute;inset:0;border-radius:18px;background:color-mix(in srgb,var(--c) 13%,var(--panel));border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent)}
.nest .seats{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);display:flex;gap:2px}
.seat{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 50% 70%,color-mix(in srgb,var(--c) 22%,transparent),transparent 62%)}
.nest .bowl{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:132px;height:30px}
.nest .tag{position:absolute;left:10px;top:8px;width:18px;height:18px;border-radius:50%;background:var(--c);display:grid;place-items:center}
.nest .tag svg{width:10px;height:10px}
.nest .count{position:absolute;right:10px;top:7px;font-size:12px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;opacity:.85}
.slot .done{position:absolute;inset:0;border-radius:18px;border:1.5px dashed var(--cell-dot);display:grid;place-items:center;color:var(--muted);font-size:12px}
.queue{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;min-height:18px}
.chip{width:20px;height:20px;border-radius:50%;display:grid;place-items:center}
.chip svg{width:11px;height:11px}
.more{letter-spacing:0;text-transform:none;font-weight:600}
.chip.first{width:24px;height:24px;box-shadow:0 0 0 2px var(--sky-top),0 0 0 3.5px var(--ink)}.chip.first svg{width:13px;height:13px}

.wire{position:relative;height:78px;margin-top:2px}
.wire svg.cable{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.wire .cable path{fill:none;stroke:var(--wire);stroke-width:3;transition:stroke .2s}
.wire .cable .pole{fill:var(--line)}
.wire.tense .cable path{stroke:var(--warn)}
.perch{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;border:2px solid #6E93AE;background:var(--sky-bot)}
.wire.tense .perch{border-color:var(--warn)}
.wire-label{position:absolute;right:0;top:0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.wire.tense .wire-label{color:var(--warn)}

.field{flex:1;min-height:0;display:grid;place-items:center;padding-block:4px}
.grid{display:grid;background:var(--field);border-radius:18px;padding:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.cell{appearance:none;border:0;background:transparent;padding:0;position:relative;cursor:pointer;width:var(--cell);height:var(--cell)}
.cell::before{content:"";position:absolute;inset:44%;border-radius:50%;background:var(--cell-dot)}
.cell:disabled{cursor:default}
.cell.has-egg::before{display:none}
.egg{position:absolute;inset:4%;display:block;pointer-events:none}
.egg svg{width:100%;height:100%;display:block;overflow:visible}
.cell.hint::after{content:"";position:absolute;inset:3px;border-radius:50%;border:2.5px solid var(--accent);animation:pulse .9s ease-in-out 3}
@keyframes pulse{50%{transform:scale(1.12);opacity:.4}}

.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-block:8px 12px}
.tool{position:relative;height:58px;border-radius:16px;border:0;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-size:12px;font-weight:600}
.tool svg{width:22px;height:22px}
.tool:disabled{opacity:.45;cursor:default}
.badge{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.badge.empty{background:var(--cell-dot);color:var(--muted)}

#stage{position:absolute;inset:0;pointer-events:none;z-index:5}
.bird{position:absolute;transform-origin:0 0}
.bi{width:100%;height:100%;transition:transform .16s ease}
.bi svg{width:100%;height:100%;display:block;overflow:visible}
.bi.d0{transform:rotate(-90deg)}.bi.d2{transform:rotate(90deg)}.bi.d3{transform:scaleX(-1)}
.bird .legs{display:none}.bird.perched .legs{display:inline}
.bird.upright .streak,.bird.flying .streak{display:none}
/* the colour symbol stays upright on screen, so it never reads as a flight arrow */
.bird .sym{transform-box:fill-box;transform-origin:center;transition:transform .16s ease}
.bi.d0 .sym{transform:rotate(90deg)}.bi.d2 .sym{transform:rotate(-90deg)}
.bird .wing{transform-box:fill-box;transform-origin:50% 30%}
.bird.flying .wing{animation:flap .14s ease-in-out infinite alternate}
@keyframes flap{to{transform:scaleY(-.7)}}
.lane{position:absolute;background:var(--warn);border-radius:4px;opacity:.85}
.feather{position:absolute;width:10px;height:16px;border-radius:50% 50% 50% 50%/70% 70% 30% 30%}

.overlay{position:absolute;inset:0;z-index:20;display:flex;overflow-y:auto;overscroll-behavior:contain;box-sizing:border-box;background:var(--scrim);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.card{margin:auto;box-sizing:border-box;background:var(--panel-hi);border-radius:24px;padding:24px 20px 20px;width:min(340px,100%);text-align:center;display:grid;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.card h2{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.05;margin:0;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.45;text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.btn{border:0;border-radius:14px;height:50px;font-weight:700;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--cell-dot)}
.btn.row{height:46px;font-weight:600;font-size:15px;background:var(--panel);justify-content:flex-start;padding-inline:16px}
.btn.danger{background:transparent;color:var(--warn);box-shadow:inset 0 0 0 1.5px var(--warn)}
.btn svg{width:18px;height:18px}
/* stars */
.total{display:flex;align-items:center;gap:5px;height:40px;padding:0 12px;border-radius:12px;background:var(--panel);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.total svg{width:16px;height:16px}
.starrow{display:flex;justify-content:center;gap:10px;margin:-2px 0 2px}
.starrow svg{width:46px;height:46px}
.starrow .mid{transform:translateY(-8px)}
/* level select */
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:min(300px,46dvh);overflow-y:auto;padding:2px;overscroll-behavior:contain}
.lvb{appearance:none;border:0;border-radius:12px;background:var(--panel);height:52px;display:grid;place-items:center;align-content:center;gap:1px;cursor:pointer;font-weight:700;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.lvb small{font-size:10px;letter-spacing:.05em;color:var(--accent);font-weight:700;min-height:12px}
.lvb.storm{box-shadow:inset 0 0 0 1.5px var(--accent)}
.lvb[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}.lvb[aria-current="true"] small{color:var(--accent-ink)}
.tips{display:grid;gap:4px;margin:0;padding:0;list-style:none;font-size:13px;color:var(--muted)}
/* daily puzzle */
.ibtn{position:relative}
.ibtn .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--panel)}
.ibtn .streak{position:absolute;bottom:-4px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:99px;background:var(--warn);color:var(--line);font-size:11px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.lvl.is-daily small{color:var(--warn)}
.lvl.is-daily b{font-size:22px;white-space:nowrap}
@media (max-width:440px){.moon{display:none}}
.flame{display:flex;justify-content:center;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:22px;color:var(--warn)}
.flame svg{width:30px;height:30px}
/* wardrobe and unlock progress */
.progress{display:grid;gap:6px;text-align:left;font-size:13px;color:var(--muted)}
.progress .bar{height:8px;border-radius:8px;background:var(--panel);overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--accent);border-radius:8px}
.wardrobe{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wear{appearance:none;border:0;border-radius:14px;background:var(--panel);padding:6px 4px 8px;display:grid;justify-items:center;gap:2px;cursor:pointer;font-size:11px;font-weight:600;color:var(--ink)}
.wear svg{width:54px;height:54px}
.wear[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.wear:disabled{cursor:default;color:var(--muted)}
.wear:disabled svg{opacity:.35;filter:grayscale(1)}
.newunlock{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:var(--panel);text-align:left;font-size:13px;color:var(--ink)}
.newunlock svg{width:44px;height:44px;flex:none}
.wear .streak,.newunlock .streak{display:none}
/* tutorial hand */
.hand{position:absolute;width:44px;height:52px;z-index:6;pointer-events:none;animation:handtap 1.1s ease-in-out infinite}
.hand svg{width:100%;height:100%;display:block;overflow:visible}
.ripple{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid var(--accent);z-index:6;pointer-events:none;animation:ripple 1.1s ease-out infinite}
@keyframes handtap{0%,100%{transform:translate(0,10px)}45%{transform:translate(0,0)}55%{transform:translate(0,0) scale(.94)}}
@keyframes ripple{0%,40%{transform:scale(.3);opacity:0}55%{opacity:.9}100%{transform:scale(1.25);opacity:0}}
.howto{display:grid;gap:10px;text-align:left;font-size:14px;line-height:1.4;color:var(--ink);margin:0;padding:0;list-style:none}
.howto li{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start}
.howto span{width:22px;height:22px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--accent)}
.toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--line);font-weight:700;font-size:14px;padding:9px 16px;border-radius:99px;pointer-events:none;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.bird.flying .wing,.cell.hint::after,.hand,.ripple{animation:none}.bi{transition:none}}
@media (max-height:640px){.slot{height:80px}.seat{width:34px;height:34px}.wire{height:64px}.tool{height:50px}
  .coach{font-size:12px;line-height:1.3;min-height:0;margin:0 0 4px}.coach:not(.teach){display:none}}
@media (min-width:600px) and (min-aspect-ratio:5/4){
  #app{max-width:1100px;display:grid;grid-template-columns:minmax(300px,380px) 1fr;column-gap:clamp(24px,4vw,56px);
    grid-template-rows:auto auto auto auto auto 1fr auto;
    grid-template-areas:"top top" "coach field" "nests field" "queue field" "wire field" ". field" "tools field";padding-block-end:12px}
  .top{grid-area:top}.coach{grid-area:coach;margin:18px 0 12px}.nests{grid-area:nests;max-width:none}.queue{grid-area:queue;margin-top:12px}
  .wire{grid-area:wire;margin-top:14px}.field{grid-area:field;padding-block:8px}.tools{grid-area:tools}
  .slot{height:104px}.toast{bottom:24px}
}
@media (max-height:540px){
  .slot{height:80px}
  .top{padding-block:6px 0}.lvl b{font-size:26px}
  .overlay{padding-block:10px}
  .card{padding:14px 16px;gap:8px;border-radius:20px}
  .card h2{font-size:22px}.card p{font-size:13px}
  .btn{height:40px;font-size:14px}.btn.row{height:36px;font-size:14px}
  .wear svg{width:40px;height:40px}.starrow svg{width:36px;height:36px}.newunlock svg{width:36px;height:36px}
  .lvb{height:44px}
}
/* very short portrait phones (320x568): a little less air so a 9-row board, the coach line and the tools all fit */
@media (max-height:600px) and (max-aspect-ratio:5/4){.slot{height:70px}.seat{width:30px;height:30px}.wire{height:54px}.tool{height:46px}.tools{padding-block:6px 8px}.queue{margin-top:4px}.nest .bowl{width:116px;height:26px}}
@media (max-height:400px) and (min-aspect-ratio:5/4){
  .slot{height:66px}.seat{width:30px;height:30px}.wire{height:52px}.tool{height:44px}.queue{margin-top:4px!important}.wire{margin-top:4px!important}
  .coach{margin:4px 0 4px!important}.nest .bowl{width:110px;height:25px}
}
@media (max-width:400px){
  .lvl{display:grid;grid-template-columns:auto auto;column-gap:6px;align-items:center;justify-content:start}
  .lvl small{grid-row:1}.lvl .boss{grid-row:1;font-size:10px;padding:1px 6px}.lvl b{grid-row:2;grid-column:1 / span 2;font-size:26px}
  .icons{gap:6px}.ibtn{width:38px;height:38px}.total{height:38px;padding:0 8px;font-size:14px}
}
@media (max-width:340px){#soundBtn{display:none}.ibtn{width:36px;height:36px}.total{height:36px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
</style>

<div id="app">
  <div class="stars" aria-hidden="true"></div><div class="moon" aria-hidden="true"></div>
  <header class="top">
    <div class="lvl"><small id="lvlLabel">Level</small><b id="lvlNum">1</b><span class="boss" id="boss" hidden>Storm</span></div>
    <div class="icons">
      <span class="total" id="starTotal" title="Stars earned"></span>
      <button class="ibtn" id="dailyBtn" aria-label="Daily puzzle"></button>
      <button class="ibtn" id="soundBtn" aria-label="Sound on"></button>
      <button class="ibtn" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
    </div>
  </header>
  <p class="coach" id="coach"></p>
  <section class="nests" id="nests" aria-label="Nests"></section>
  <div class="queue" id="queue"></div>
  <section class="wire" id="wire" aria-label="Wire"><svg class="cable" id="cable" aria-hidden="true"></svg><span class="wire-label" id="wireLabel"></span></section>
  <section class="field" id="field"><div class="grid" id="grid" role="group" aria-label="Roost"></div></section>
  <footer class="tools">
    <button class="tool" id="undoBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Undo<span class="badge" id="undoBadge"></span></button>
    <button class="tool" id="hintBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.8V16h5v-.3c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3Z"/></svg>Hint<span class="badge" id="hintBadge"></span></button>
    <button class="tool" id="perchBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2 14c6 4 14 4 20 0"/><path d="M12 5v6M9 8h6"/></svg>+1 Perch<span class="badge" id="perchBadge"></span></button>
  </footer>
  <div id="stage"></div>
  <p class="sr" id="sr" aria-live="polite"></p>
  <div class="overlay" id="overlay" hidden><div class="card" id="card" role="dialog" aria-modal="true"></div></div>
</div>

<script>
const PAL=[
  {name:'Coral',hex:'#EF6A5B',dark:'#B5423A',sym:'dot'},
  {name:'Mustard',hex:'#F2BE45',dark:'#B9861C',sym:'tri'},
  {name:'Sky',hex:'#57ACE8',dark:'#2D72A6',sym:'sq'},
  {name:'Mint',hex:'#55CB90',dark:'#2A8B5C',sym:'dia'},
  {name:'Plum',hex:'#A97DE2',dark:'#6C4AA6',sym:'plus'},
  {name:'Rose',hex:'#F48CC2',dark:'#B5548A',sym:'bar'},
];
const DIRNAME=['up','right','down','left'];
const $=s=>document.querySelector(s);
const app=$('#app'),stage=$('#stage'),gridEl=$('#grid'),fieldEl=$('#field'),nestsEl=$('#nests'),wireEl=$('#wire'),queueEl=$('#queue'),overlay=$('#overlay'),card=$('#card');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const T=ms=>RM?Math.min(ms,90):ms;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

let level=Math.max(1,store.get('fh.level',1)|0), soundOn=store.get('fh.sound',true)!==false, vibeOn=store.get('fh.vibe',true)!==false;
let best=store.get('fh.stars',{});if(!best||typeof best!=='object')best={};
let daily=store.get('fh.daily',{});if(!daily||typeof daily!=='object')daily={};   // {last:'YYYY-MM-DD', streak:n, top:n}
let wear=store.get('fh.wear','');                                                  // equipped accessory id, '' = none
// highest level the player can pick in the level list (older saves only have fh.level and fh.stars)
let maxLevel=Math.max(level,store.get('fh.max',1)|0,...Object.keys(best).map(k=>(+k|0)+1));

  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+.03);

/* ---------- level setup ---------- */

// The campaign run is parked while the player visits the daily puzzle and restored exactly on the

let parked=null;
// One-time tips at the moment something first happens (the first time a bird is blocked, waits on

// player, so the rules are taught by what just happened rather than by text up front.
let seen=store.get('fh.seen',{});if(!seen||typeof seen!=='object')seen={};

  if(seen[key])return;seen[key]=1;store.set('fh.seen',seen);

  if(!RM)c.animate([{opacity:0,transform:'translateY(4px)'},{opacity:1,transform:'none'}],{duration:260,easing:'ease-out'});

function startDaily(){
  if(locked||flights>0){setTimeout(startDaily,120);return}   // let the current move finish first
  if(mode==='level'&&G&&!over&&G.moves>0)parked={level,lv:G.lv,cap:G.cap,state:stateJSON(),undo:G.undo.slice(),tools:{...G.tools},
    continues:G.continues,moves:G.moves,usedBooster:G.usedBooster,usedRewardedAd:G.usedRewardedAd};

}
function backToLevel(){
  const p=parked;parked=null;

  mode='level';setupLevel(p.lv);
  Object.assign(G,{cap:p.cap,undo:p.undo,tools:p.tools,continues:p.continues,moves:p.moves,usedBooster:p.usedBooster,usedRewardedAd:p.usedRewardedAd});

function setupLevel(lv){
  const L=level;

  G={lv,birds:lv.birds.map((b,i)=>({...b,id:i,loc:{t:'grid'}})),occ:new Int16Array(lv.R*lv.C).fill(-1),
     nests:Array.from({length:open},(_,i)=>i<lv.queue.length?{c:lv.queue[i],filled:[]}:null),qi:Math.min(open,lv.queue.length),
     wire:[],cap:lv.cap,undo:[],tools:{undo:3,hint:2,perch:1},continues:0,peak:0,moves:0,usedBooster:false,usedRewardedAd:false};

function buildGrid(){

  (G.lv.eggs||[]).forEach((e,k)=>{
    const i=e.r*G.lv.C+e.c,cell=gridEl.children[i],alive=G.occ[i]===G.birds.length+k;

function layoutWire(){
  const W=wireEl.clientWidth,H=wireEl.clientHeight,y0=H*0.5,sag=H*0.2,pad=6;
  const yAt=x=>{const t=(x-pad)/(W-2*pad);return y0+4*sag*t*(1-t)};
  $('#cable').setAttribute('viewBox',`0 0 ${W} ${H}`);
  $('#cable').innerHTML=`<rect class="pole" x="0" y="${y0-14}" width="5" height="${H-y0+14}" rx="2"/><rect class="pole" x="${W-5}" y="${y0-14}" width="5" height="${H-y0+14}" rx="2"/><path d="M${pad} ${y0} Q ${W/2} ${y0+2*sag} ${W-pad} ${y0}"/>`;
  const ps=wireEl.querySelectorAll('.perch'),n=ps.length,inner=W-2*pad-40;
  ps.forEach((p,i)=>{const x=pad+20+inner*(n===1?.5:i/(n-1));p.style.left=x+'px';p.style.top=yAt(x)+'px'});

function updateTools(){

    if(v>0){b.textContent=v;b.className='badge'}else if(Ads.enabled){b.textContent='AD';b.className='badge'}else{b.textContent='0';b.className='badge empty'}
    $('#'+id+'Btn').disabled=!!dis||(v<=0&&!Ads.enabled)};

/* ---------- positions & motion ---------- */
function anchorFor(b){
  const sr=stage.getBoundingClientRect();let r,s,x,y;
  if(b.loc.t==='grid'){r=gridEl.children[b.r*G.lv.C+b.c].getBoundingClientRect();s=r.width*.94;x=r.left-sr.left+(r.width-s)/2;y=r.top-sr.top+(r.height-s)/2}
  else if(b.loc.t==='nest'){const seat=nestsEl.children[b.loc.n].querySelectorAll('.seat')[b.loc.k];if(!seat)return null;r=seat.getBoundingClientRect();s=r.width*1.12;x=r.left-sr.left+(r.width-s)/2;y=r.top-sr.top+(r.height-s)/2-2}
  else if(b.loc.t==='wire'){const p=wireEl.querySelectorAll('.perch')[b.loc.i];if(!p)return null;r=p.getBoundingClientRect();s=Math.min(46,wireEl.clientHeight*.62);x=r.left-sr.left+r.width/2-s/2;y=r.top-sr.top+r.height/2-s*.84}
  else return null;
  return {x,y,s};
}
function orient(b){
  const bi=b.el.firstChild,upright=b.loc.t!=='grid';
  bi.className='bi'+(upright?'':' d'+b.d);b.el.classList.toggle('upright',upright);b.el.classList.toggle('perched',b.loc.t==='wire');
}
function setBird(b,animate=false,via=null,dur=480){
  const el=b.el,a=anchorFor(b);
  if(!a){el.hidden=true;return Promise.resolve()}
  let from=null;
  if(animate&&!el.hidden){const r=el.getBoundingClientRect(),sr=stage.getBoundingClientRect();if(r.width>0)from={x:r.left-sr.left,y:r.top-sr.top,s:r.width}}
  el.getAnimations().forEach(x=>x.cancel());
  el.hidden=false;el.style.left=a.x+'px';el.style.top=a.y+'px';el.style.width=a.s+'px';el.style.height=a.s+'px';
  if(!from){orient(b);return Promise.resolve()}
  const tf=p=>`translate(${p.x-a.x}px,${p.y-a.y}px) scale(${p.s/a.s})`;
  const frames=[{transform:tf(from)}];
  if(via)frames.push({transform:tf(via),offset:.36});
  frames.push({transform:'translate(0,0) scale(1)'});
  const anim=el.animate(frames,{duration:T(dur),easing:via?'cubic-bezier(.35,.1,.35,1)':'cubic-bezier(.3,.8,.3,1)'});
  return anim.finished.then(()=>orient(b),()=>{});
}
function layoutAll(){
  if(!G)return;sizeGrid();layoutWire();
  G.birds.forEach(b=>setBird(b,false));
  if(handEl)updateHand();
}
function exitPoint(b){
  const a=anchorFor(b),sr=stage.getBoundingClientRect(),gr=gridEl.getBoundingClientRect();
  const cx=a.x+a.s/2,cy=a.y+a.s/2,gl=gr.left-sr.left,gt=gr.top-sr.top,m=a.s*.55;
  let ex=cx,ey=cy;
  if(b.d===0)ey=gt-m;else if(b.d===2)ey=gt+gr.height+m;else if(b.d===3)ex=gl-m;else ex=gl+gr.width+m;
  return {x:ex-a.s/2,y:ey-a.s/2,s:a.s};
}
const center=b=>({x:parseFloat(b.el.style.left)+parseFloat(b.el.style.width)/2,y:parseFloat(b.el.style.top)+parseFloat(b.el.style.height)/2});

/* ---------- play ---------- */
const srEl=$('#sr');let srT=null;
function say(msg){clearTimeout(srT);srEl.textContent='';srT=setTimeout(()=>srEl.textContent=msg,30)}
async function tapCell(i){
  if(over||locked||!G||!overlay.hidden)return;
  const id=G.occ[i];if(id<0||isEgg(id))return;
  const b=G.birds[id],bl=rayBlocker(G.occ,G.lv.R,G.lv.C,b.r,b.c,b.d);
  if(bl>=0){
    if(isEgg(bl)){const n=PAL[eggOf(bl).color].name.toLowerCase();blockedFx(b,bl);
      tipOnce('blockedEgg',`Blocked by the <b>${n} egg</b>. It hatches when the ${n} nest is full.`);return}
    if(handEl&&level===1&&mode==='level'&&!seen.blocked)G.teachBlock=bl;
    blockedFx(b,bl);tipOnce('blocked',`Blocked: the <b>${PAL[G.birds[bl].color].name.toLowerCase()} bird</b> is in its way. Free that one first.`);updateHand();return}
  pushUndo();G.moves++;
  const via=exitPoint(b),run=runId,hadFocus=document.activeElement===gridEl.children[i];
  G.occ[i]=-1;cellAria(i);if(hadFocus)focusNear(b.r,b.c);
  const ni=G.nests.findIndex(n=>n&&n.c===b.color&&n.filled.length<3);
  let full=false,wireFull=false;
  if(ni>=0){const n=G.nests[ni];n.filled.push(id);b.loc={t:'nest',n:ni,k:n.filled.length-1};full=n.filled.length===3}
  else{G.wire.push(id);b.loc={t:'wire',i:G.wire.length-1};G.peak=Math.max(G.peak,G.wire.length);wireFull=G.wire.length>=G.cap}
  if(full||wireFull)locked=true;
  updateWireState();updateTools();sfx.chirp(b.color);buzz(8);hideHand();if(id===G.teachBlock)G.teachBlock=-1;
  if(ni<0&&!wireFull){
    if(!seen.wire)tipOnce('wire','No open nest for that colour, so it <b>waits on the wire</b> until its nest arrives.');
    else if(G.wire.length===G.cap-1)tipOnce('tense','<b>One perch left.</b> Free only birds the open nest needs, or the wire fills up.');
  }
  updateCount(ni);
  say(ni>=0?`${PAL[b.color].name} bird to the nest, ${G.nests[ni].filled.length} of 3`:`${PAL[b.color].name} bird waits on the wire, ${G.wire.length} of ${G.cap} perches`);
  b.el.classList.add('flying');flights++;
  await setBird(b,true,via,520);
  if(run!==runId)return;   // level restarted or switched during the flight
  b.el.classList.remove('flying');flights--;
  if(full){await completeNest(ni,run);if(run!==runId)return;locked=false}
  if(wireFull){if(G.wire.length>=G.cap){await sleep(T(160));if(run!==runId)return;showFail();return}locked=false}
  checkWin();updateHand();
  if(!over&&!freeMoves({...G.lv,cap:G.cap},liteFromG()).length)showStuck();   // only possible with eggs
}
// A nest of this colour was completed: its eggs hatch (same moment as hatch() in the engine).
function hatchEggs(color){
  (G.lv.eggs||[]).forEach((e,k)=>{
    const i=e.r*G.lv.C+e.c,id=G.birds.length+k;
    if(e.color!==color||G.occ[i]!==id)return;
    G.occ[i]=-1;cellAria(i);gridEl.children[i].classList.remove('has-egg');
    const el=gridEl.children[i].querySelector('.egg');if(!el)return;
    sfx.crack();
    const n=PAL[color].name.toLowerCase();say(`The ${n} egg hatched`);
    tipOnce('hatch',`The ${n} nest is full, so the <b>${n} egg hatched</b> and cleared the way.`);
    if(RM){el.remove();return}
    el.querySelector('.crack').setAttribute('opacity','1');
    el.animate([{transform:'none',opacity:1},{transform:'rotate(-8deg)',opacity:1,offset:.25},{transform:'rotate(8deg)',opacity:1,offset:.5},{transform:'scale(1.25)',opacity:0}],{duration:520,easing:'ease-in'}).finished.then(()=>el.remove(),()=>el.remove());
  });
}
async function completeNest(ni,run=runId){
  await sleep(T(130));if(run!==runId)return;
  const slot=nestsEl.children[ni],n=G.nests[ni],birds=n.filled.map(id=>G.birds[id]);
  sfx.nest();
  buzz([12,40,12]);
  const anims=[];const nestEl=slot.querySelector('.nest');
  if(nestEl)anims.push(nestEl.animate([{transform:'none',opacity:1},{transform:'translateY(-36px) scale(.92)',opacity:0}],{duration:T(380),easing:'ease-in',fill:'forwards'}));
  birds.forEach((b,j)=>{b.el.classList.add('flying');anims.push(b.el.animate([{transform:'none',opacity:1},{transform:`translate(${(j-1)*34}px,-130px) scale(.7)`,opacity:0}],{duration:T(440),delay:T(j*40),easing:'ease-in',fill:'forwards'}))});
  await Promise.all(anims.map(a=>a.finished.catch(()=>{})));
  if(run!==runId)return;
  birds.forEach(b=>{b.loc={t:'gone'};b.el.getAnimations().forEach(a=>a.cancel());b.el.classList.remove('flying');b.el.hidden=true});
  hatchEggs(n.c);
  G.nests[ni]=G.qi<G.lv.queue.length?{c:G.lv.queue[G.qi++],filled:[]}:null;
  say(G.nests[ni]?`Nest full. Next nest: ${PAL[G.nests[ni].c].name}`:'Nest full');
  renderNest(ni);renderQueue();
  const fresh=slot.querySelector('.nest');
  if(fresh)await fresh.animate([{transform:'translateY(-26px)',opacity:0},{transform:'none',opacity:1}],{duration:T(280),easing:'cubic-bezier(.2,.9,.3,1.25)'}).finished.catch(()=>{});
  if(run!==runId)return;
  // keep birds already sitting in the other nest anchored after the re-render
  G.birds.forEach(b=>{if(b.loc.t==='nest'&&b.loc.n!==ni)setBird(b,false)});
  const nn=G.nests[ni];if(!nn)return;
  let k=0;
  while(nn.filled.length<3&&k<G.wire.length){
    const id=G.wire[k],b=G.birds[id];
    if(b.color!==nn.c){k++;continue}
    G.wire.splice(k,1);nn.filled.push(id);b.loc={t:'nest',n:ni,k:nn.filled.length-1};
    G.wire.forEach((wid,ix)=>G.birds[wid].loc={t:'wire',i:ix});
    sfx.hop();updateWireState();updateCount(ni);
    tipOnce('hop','Its nest arrived, so the waiting bird <b>hopped in</b> from the wire.');
    b.el.classList.add('flying');
    const ps=[setBird(b,true,null,340)];G.wire.forEach(wid=>ps.push(setBird(G.birds[wid],true,null,260)));
    await Promise.all(ps);if(run!==runId)return;b.el.classList.remove('flying');
  }
  if(nn.filled.length===3)await completeNest(ni,run);
}
function checkWin(){
  if(over||!G.birds.every(b=>b.loc.t==='gone'))return;
  const run=runId;over=true;sfx.win();buzz([20,60,20,60,40]);feathers();setTimeout(()=>{if(run===runId)showWin()},T(650));
}
function blockedFx(b,bl){
  const egg=isEgg(bl),e=egg?eggOf(bl):null,blk=egg?null:G.birds[bl];
  ensureAudio();sfx.bonk();buzz(25);say(`Blocked by the ${PAL[egg?e.color:blk.color].name} ${egg?'egg':'bird'}`);
  if(!RM)b.el.animate([{transform:'none'},{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'translateX(-2px)'},{transform:'none'}],{duration:280});
  let c;
  if(egg){
    const cell=gridEl.children[e.r*G.lv.C+e.c],r=cell.getBoundingClientRect(),sr=stage.getBoundingClientRect();
    c={x:r.left-sr.left+r.width/2,y:r.top-sr.top+r.height/2};
    const el=cell.querySelector('.egg');if(el)el.animate([{transform:'none'},{transform:'rotate(-10deg)'},{transform:'rotate(8deg)'},{transform:'none'}],{duration:320});
  }else{
    blk.el.animate([{transform:'none'},{transform:`translate(${blk.el.offsetWidth*.04}px,${blk.el.offsetWidth*.04}px) scale(.92)`},{transform:'none'}],{duration:280});
    c=center(blk);
  }
  const a=center(b),ln=document.createElement('div');ln.className='lane';
  if(Math.abs(a.x-c.x)>1){ln.style.left=Math.min(a.x,c.x)+'px';ln.style.top=(a.y-2)+'px';ln.style.width=Math.abs(a.x-c.x)+'px';ln.style.height='4px'}
  else{ln.style.left=(a.x-2)+'px';ln.style.top=Math.min(a.y,c.y)+'px';ln.style.height=Math.abs(a.y-c.y)+'px';ln.style.width='4px'}
  stage.insertBefore(ln,stage.firstChild);
  ln.animate([{opacity:.9},{opacity:.9,offset:.5},{opacity:0}],{duration:T(650)}).finished.then(()=>ln.remove(),()=>ln.remove());
}

// Keyboard play: after a bird leaves, focus the nearest bird still on the grid (its cell gets disabled,
// which would otherwise drop focus to the page). Arrow keys move between birds.
function birdCells(){return [...gridEl.children].filter(el=>!el.disabled)}
function focusNear(r,c){
  const C=G.lv.C;let best=null,bd=Infinity;
  for(const el of birdCells()){const i=+el.dataset.i,d=Math.hypot(Math.floor(i/C)-r,i%C-c);if(d<bd){bd=d;best=el}}
  if(best)best.focus({preventScroll:true});
}
const ARROWS={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]};
function arrowMove(from,key){
  const C=G.lv.C,[dr,dc]=ARROWS[key],i=+from.dataset.i,r=Math.floor(i/C),c=i%C;let best=null,bs=Infinity;
  for(const el of birdCells()){
    const j=+el.dataset.i,rr=Math.floor(j/C)-r,cc=j%C-c,along=rr*dr+cc*dc,across=Math.abs(rr*dc)+Math.abs(cc*dr);
    if(along<=0)continue;const sc=along+2*across;if(sc<bs){bs=sc;best=el}
  }
  if(best)best.focus({preventScroll:true});
}

/* ---------- tools ---------- */
const stateJSON=()=>JSON.stringify({locs:G.birds.map(b=>b.loc),occ:[...G.occ],nests:G.nests,qi:G.qi,wire:G.wire,peak:G.peak});
function pushUndo(){G.undo.push(stateJSON());if(G.undo.length>40)G.undo.shift()}
function doUndo(){
  if(locked||over||flights>0||!G.undo.length)return;
  if(G.tools.undo<=0){if(Ads.enabled)Ads.rewarded('undo',()=>{G.usedRewardedAd=true;G.tools.undo++;doUndo()});else toast('No undos left on this level');return}
  G.tools.undo--;G.usedBooster=true;restore(G.undo.pop());toast('Move undone');
}
function restore(json,animate=true){
  const s=JSON.parse(json);
  G.birds.forEach((b,i)=>b.loc=s.locs[i]);G.occ=Int16Array.from(s.occ);G.nests=s.nests;G.qi=s.qi;G.wire=s.wire;G.peak=s.peak??G.peak;
  renderNests();renderQueue();renderEggs();for(let i=0;i<G.occ.length;i++)cellAria(i);
  G.birds.forEach(b=>setBird(b,animate,null,300));updateWireState();updateTools();updateHand();
}
function liteFromG(){
  return {occ:Int16Array.from(G.occ),alive:Uint8Array.from(G.birds.map(b=>b.loc.t==='grid'?1:0)),rem:G.birds.filter(b=>b.loc.t==='grid').length,
          wire:G.wire.map(id=>G.birds[id].color),nests:G.nests.map(n=>n?{c:n.c,n:n.filled.length}:null),qi:G.qi};
}
function doHint(){
  if(locked||over||flights>0)return;
  if(G.tools.hint<=0){if(Ads.enabled)Ads.rewarded('hint',()=>{G.usedRewardedAd=true;G.tools.hint++;doHint()});else toast('No hints left on this level');return}
  const lv={...G.lv,cap:G.cap},s=liteFromG();

  // No winning line from here: say so and keep the hint (and the star) instead of pointing at a losing move.
  if(!path||!path.length){toast(G.undo.length?'No way out from here. Try Undo.':'No way out from here. Try again.');return}
  const m=path[0];
  G.tools.hint--;G.usedBooster=true;updateTools();
  const b=G.birds[m],cell=gridEl.children[b.r*G.lv.C+b.c];say(`Hint: the ${PAL[b.color].name} bird facing ${DIRNAME[b.d]}`);
  cell.classList.remove('hint');void cell.offsetWidth;cell.classList.add('hint');
  setTimeout(()=>cell.classList.remove('hint'),2800);
}
function doPerch(){
  if(locked||over||flights>0||G.cap>=9)return;
  if(G.tools.perch<=0){if(Ads.enabled)Ads.rewarded('perch',()=>{G.usedRewardedAd=true;G.tools.perch++;doPerch()});else toast('No extra perches left on this level');return}

// Stars: 3 for a clean win, minus one for using a booster (not on the practice levels 1–5), minus

    ?`The <b>${far.join('</b> and <b>')}</b> ${far.length>1?'birds were':'bird was'} waiting for nests far down the line. Next time, free birds for the open nest and the next one first.`
    :`All of these nests were coming soon. Next time, fill the open nest first so they can hop in sooner.`;
  showOverlay(`<span class="eyebrow">${isDaily?'Daily puzzle':`Level ${level}`}</span><h2>The wire is full</h2>
    <div class="waiting" aria-label="Waiting on the wire: ${waitC.map(c=>PAL[c].name).join(', ')}">On the wire ${waitC.map(c=>`<span class="chip" style="background:${PAL[c].hex}">${symSvg(c)}</span>`).join('')}</div>
    <p>${why}</p>
    ${canGo?`<button class="btn primary" id="contBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>${Ads.enabled?'Watch ad':'Keep going'} · +2 perches</button>`:''}
    <button class="btn ${canGo?'ghost':'primary'}" id="retryBtn">Try again</button>
    ${isDaily?`<button class="btn ghost" id="backLvlBtn">Back to level ${level}</button>`:''}`);
  if(isDaily)$('#backLvlBtn').onclick=backToLevel;
  if(canGo)$('#contBtn').onclick=()=>{const go=()=>{if(Ads.enabled)G.usedRewardedAd=true;hideOverlay();G.continues++;over=false;locked=false;addPerch(2);toast('+2 perches. Keep going!')};Ads.enabled?Ads.rewarded('continue',go):go()};
  $('#retryBtn').onclick=()=>mode==='daily'?startDaily():startLevel(level);
}
// Eggs make a new dead end possible: every bird left is blocked (by eggs or by birds behind them),
// so nothing can move. More perches cannot help, so this offers Undo instead of Keep going.
function showStuck(){
  over=true;sfx.fail();buzz(120);hideHand();
  const isDaily=mode==='daily',canUndo=G.undo.length>0&&G.tools.undo>0;
  showOverlay(`<span class="eyebrow">${isDaily?'Daily puzzle':`Level ${level}`}</span><h2>No bird can fly</h2>
    <p>Every bird left is blocked, so nothing can move. Eggs only hatch when the nest of their colour is full, so free those birds first.</p>
    ${canUndo?`<button class="btn primary" id="stUndo">Undo last move</button>`:''}
    <button class="btn ${canUndo?'ghost':'primary'}" id="retryBtn">Try again</button>
    ${isDaily?`<button class="btn ghost" id="backLvlBtn">Back to level ${level}</button>`:''}`);
  if(canUndo)$('#stUndo').onclick=()=>{hideOverlay();over=false;doUndo()};
  if(isDaily)$('#backLvlBtn').onclick=backToLevel;
  $('#retryBtn').onclick=()=>mode==='daily'?startDaily():startLevel(level);
}
function equip(id){
  wear=id;store.set('fh.wear',wear);
  if(G)G.birds.forEach(b=>{const bi=b.el.querySelector('.bi');if(bi)bi.innerHTML=birdSVG(b.color)});
}
function showWardrobe(){
  const t=totalStars();
  showOverlay(`<h2>Wardrobe</h2><p>${t} stars earned. Earn stars to unlock more.</p>
    <div class="wardrobe">
      <button class="wear" data-id="" aria-pressed="${!wear}"><svg viewBox="-2 -4 44 44">${birdSVG(3,'').replace(/^<svg[^>]*>|<\/svg>$/g,'')}</svg>None</button>
      ${ACC.map(a=>`<button class="wear" data-id="${a.id}" aria-pressed="${wear===a.id}" ${t<a.stars?'disabled':''}><svg viewBox="-2 -4 44 44">${birdSVG(3,a.id).replace(/^<svg[^>]*>|<\/svg>$/g,'')}</svg>${t<a.stars?`${a.stars}★`:a.name}</button>`).join('')}
    </div>
    <button class="btn primary" id="wClose">Done</button>`,true);
  card.querySelectorAll('.wear:not(:disabled)').forEach(b=>b.onclick=()=>{equip(b.dataset.id);showWardrobe()});
  $('#wClose').onclick=hideOverlay;
}
const canVibrate='vibrate' in navigator;
const soundInMenu=()=>getComputedStyle($('#soundBtn')).display==='none';   // the header drops it on very narrow phones
function showMenu(){
  const isDaily=mode==='daily';
  showOverlay(`<h2>Menu</h2>
    ${isDaily?`<button class="btn row" id="mBack">Back to level ${level}</button>`
             :`<button class="btn row" id="mDaily">Daily puzzle${solvedToday()?' · solved today':''}</button>`}
    <button class="btn row" id="mLevels">Levels</button>
    <button class="btn row" id="mWear">Wardrobe · ${totalStars()}★</button>
    <button class="btn row" id="mHow">How to play</button>
    <button class="btn row" id="mRestart">${isDaily?'Restart today’s puzzle':`Restart level ${level}`}</button>
    ${soundInMenu()?`<button class="btn row" id="mSound">Sound: ${soundOn?'on':'off'}</button>`:''}
    ${canVibrate?`<button class="btn row" id="mVibe">Vibration: ${vibeOn?'on':'off'}</button>`:''}
    <button class="btn row" id="mReset">Start over from level 1</button>
    <button class="btn primary" id="mClose">Back to the game</button>`,true);
  $('#mHow').onclick=showHow;$('#mRestart').onclick=()=>isDaily?startDaily():startLevel(level);
  if(isDaily)$('#mBack').onclick=backToLevel;else $('#mDaily').onclick=startDaily;
  $('#mLevels').onclick=showLevels;$('#mWear').onclick=showWardrobe;
  if(soundInMenu())$('#mSound').onclick=()=>{toggleSound();showMenu()};
  if(canVibrate)$('#mVibe').onclick=()=>{vibeOn=!vibeOn;store.set('fh.vibe',vibeOn);if(vibeOn)buzz(30);showMenu()};
  $('#mReset').onclick=showConfirmReset;$('#mClose').onclick=hideOverlay;
}
function showConfirmReset(){
  const t=totalStars();
  showOverlay(`<h2>Start over?</h2>
    <p>This takes you back to level 1${t?` and erases your ${t} stars and unlocked accessories`:''}. Your daily streak stays.</p>
    <button class="btn primary" id="rCancel">Keep my progress</button>
    <button class="btn danger" id="rYes">Erase and start over</button>`,true);
  $('#rCancel').onclick=showMenu;
  $('#rYes').onclick=()=>{best={};store.set('fh.stars',best);wear='';store.set('fh.wear','');maxLevel=1;store.set('fh.max',1);startLevel(1)};
}
// Level list: replay any level reached so far for more stars (GAME_DESIGN.md: "Stars give a reason to replay easy levels").
function showLevels(){
  const cur=mode==='level'?level:0;
  const cells=[];
  for(let L=1;L<=maxLevel;L++){
    const s=+best[L]||0,storm=L<=LEVEL_PACK.length?!!LEVEL_PACK[L-1].boss:L%10===0;
    cells.push(`<button class="lvb${storm?' storm':''}" data-l="${L}" aria-current="${L===cur}" aria-label="Level ${L}${storm?', Storm':''}, ${s} of 3 stars">${L}<small>${'★'.repeat(s)}</small></button>`);
  }
  showOverlay(`<h2>Levels</h2><p>${totalStars()} stars so far. Replay any level to earn the ones you missed.</p>
    <div class="lvgrid">${cells.join('')}</div>
    <button class="btn primary" id="lvClose">Back</button>`,true);
  card.querySelectorAll('.lvb').forEach(b=>b.onclick=()=>startLevel(+b.dataset.l));
  $('#lvClose').onclick=showMenu;
  const at=card.querySelector('.lvb[aria-current="true"]')||card.querySelector('.lvb:last-child');
  if(at)at.scrollIntoView({block:'center'});
}
function showHow(){
  showOverlay(`<h2>How to play</h2><ul class="howto">
    <li><span>1</span>Tap a bird. It flies off only if no bird sits in the direction it faces.</li>
    <li><span>2</span>If its colour matches the open nest, it lands there. Three birds fill a nest, and the next nest moves in.</li>
    <li><span>3</span>Any other bird waits on the wire. Waiting birds hop into their nest as soon as it arrives.</li>
    <li><span>4</span>Fill every perch on the wire and the level is lost. Watch the “Up next” row and free birds in the right order.</li>
    <li><span>★</span>Three stars: win without Undo, Hint or +1 Perch, and keep at least two perches free. On levels 1–5 boosters are free.</li></ul>
    <button class="btn primary" id="howOk">Got it</button>`,true);
  $('#howOk').onclick=hideOverlay;
}
/* ---------- tutorial hand, level 1: free a bird; then try a blocked one (it bonks and the tip
   explains); then free the bird that was in its way. Ends after that, or after two free moves if the
   player has already seen a blocked bird. ---------- */
const HAND=`<svg viewBox="0 0 44 52" aria-hidden="true"><path d="M17 4.5a5 5 0 0 1 10 0V22l3.2-.6a4.6 4.6 0 0 1 2.5.3l3.6 1.6a6 6 0 0 1 3.5 6.3l-1.6 10.6A10 10 0 0 1 28.3 49H21a10 10 0 0 1-8.1-4.2l-7-9.7a4.3 4.3 0 0 1 6.4-5.6L17 33.4Z" fill="#F7F1E6" stroke="#0B1824" stroke-width="2.4" stroke-linejoin="round"/><path d="M27 22v9M31.5 22.5v8.5" stroke="#0B1824" stroke-width="2" stroke-linecap="round"/></svg>`;
let handEl=null,rippleEl=null;
function hideHand(){if(handEl){handEl.remove();handEl=null}if(rippleEl){rippleEl.remove();rippleEl=null}}
function handTarget(){
  if(mode!=='level'||level!==1||over||!G)return null;
  const lv={...G.lv,cap:G.cap},s=liteFromG(),open=G.nests.find(Boolean);
  if(G.teachBlock===-1)return null;                                                       // lesson done
  if(G.teachBlock>=0)return G.birds[G.teachBlock].loc.t==='grid'?G.teachBlock:null;       // free the bird in the way
  if(G.moves>=1&&!seen.blocked){                                                          // show a blocked bird
    let pick=null;
    for(const b of G.birds){
      if(b.loc.t!=='grid')continue;
      const bl=rayBlocker(G.occ,lv.R,lv.C,b.r,b.c,b.d);if(bl<0||isEgg(bl))continue;
      const k=G.birds[bl];if(rayBlocker(G.occ,lv.R,lv.C,k.r,k.c,k.d)>=0)continue;
      if(pick==null||(open&&k.color===open.c))pick=b.id;
      if(open&&k.color===open.c)break;
    }
    if(pick!=null)return pick;
  }
  if(G.moves>=2)return null;
  const path=solve(lv,s,20000);
  return path&&path.length?path[0]:null;
}
function updateHand(){
  hideHand();
  const t=handTarget();if(t==null)return;
  const b=G.birds[t],a=anchorFor(b);if(!a)return;
  const cx=a.x+a.s/2,cy=a.y+a.s/2;
  rippleEl=document.createElement('div');rippleEl.className='ripple';rippleEl.style.left=cx+'px';rippleEl.style.top=cy+'px';
  handEl=document.createElement('div');handEl.className='hand';handEl.innerHTML=HAND;handEl.style.left=(cx-16)+'px';handEl.style.top=(cy+6)+'px';
  stage.appendChild(rippleEl);stage.appendChild(handEl);
}

function feathers(){
  if(RM)return;
  const sr=stage.getBoundingClientRect(),cols=[...new Set(G.lv.queue)];
  for(let i=0;i<26;i++){
    const f=document.createElement('div');f.className='feather';f.style.background=PAL[cols[i%cols.length]].hex;
    const x=Math.random()*sr.width;f.style.left=x+'px';f.style.top='-20px';stage.appendChild(f);
    const dx=(Math.random()-.5)*120,rot=(Math.random()-.5)*720;
    f.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${dx}px,${sr.height*.75}px) rotate(${rot}deg)`,opacity:0}],{duration:1400+Math.random()*900,delay:Math.random()*300,easing:'cubic-bezier(.25,.4,.45,1)'}).finished.then(()=>f.remove(),()=>f.remove());
  }
}

/* ---------- wiring ---------- */
gridEl.addEventListener('pointerdown',e=>{const c=e.target.closest('.cell');if(!c)return;e.preventDefault();ensureAudio();tapCell(+c.dataset.i)});
gridEl.addEventListener('keydown',e=>{
  const c=e.target.closest('.cell');if(!c||!G)return;
  if(ARROWS[e.key]){e.preventDefault();arrowMove(c,e.key);return}
  if(e.key!=='Enter'&&e.key!==' ')return;e.preventDefault();ensureAudio();tapCell(+c.dataset.i)});
overlay.addEventListener('click',e=>{if(e.target===overlay&&overlayDismiss)hideOverlay()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!overlay.hidden&&overlayDismiss){e.preventDefault();hideOverlay()}});
$('#undoBtn').onclick=()=>{ensureAudio();doUndo()};
$('#hintBtn').onclick=()=>{ensureAudio();doHint()};
$('#perchBtn').onclick=()=>{ensureAudio();doPerch()};
$('#menuBtn').onclick=showMenu;
$('#dailyBtn').onclick=()=>{if(mode==='daily'&&!over&&G.lv.day===dayNum())return;startDaily()};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)paintDaily()});   // day may have rolled over
function toggleSound(){soundOn=!soundOn;store.set('fh.sound',soundOn);paintSound();if(soundOn)ensureAudio()}
$('#soundBtn').onclick=toggleSound;
let rT=null;
new ResizeObserver(()=>{clearTimeout(rT);rT=setTimeout(layoutAll,60)}).observe(app);
paintSound();
startLevel(level);
// No intro card: new players start playing at once; the hand and coach line teach level 1.
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>layoutAll());
</script>
