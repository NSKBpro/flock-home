<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Sniglet';font-weight:800;src:url(../../assets/fonts/sniglet-latin-800-normal.woff2) format('woff2')}
html,body{margin:0;padding:0;overflow:hidden;background:#13263A}
#c{position:relative;overflow:hidden}
#c svg.bird,#c svg.bowl{position:absolute;overflow:visible}
.title{position:absolute;margin:0;font-family:'Sniglet',sans-serif;font-weight:800;color:#F7F1E6;line-height:.86;letter-spacing:-.01em;
  -webkit-text-stroke:var(--sw) #0B1824;paint-order:stroke fill;text-shadow:0 var(--sh) 0 #0B1824, 0 calc(var(--sh)*2.2) calc(var(--sh)*3) rgba(5,12,18,.55)}
.title span{display:block}
.title .home{color:#F4C95D}
</style></head>
<body><div id="c"></div>
<script>
const PAL=[
  {hex:'#EF6A5B',dark:'#B5423A',sym:'dot'},{hex:'#F2BE45',dark:'#B9861C',sym:'tri'},{hex:'#57ACE8',dark:'#2D72A6',sym:'sq'},
  {hex:'#55CB90',dark:'#2A8B5C',sym:'dia'},{hex:'#A97DE2',dark:'#6C4AA6',sym:'plus'},{hex:'#F48CC2',dark:'#B5548A',sym:'bar'}];
function sym(s,fill){const f=`fill="${fill}"`;switch(s){case 'dot':return `<circle cx="5" cy="5" r="4" ${f}/>`;case 'tri':return `<polygon points="5,0.6 9.6,9 0.4,9" ${f}/>`;case 'sq':return `<rect x="1.2" y="1.2" width="7.6" height="7.6" rx="1" ${f}/>`;case 'dia':return `<polygon points="5,0 10,5 5,10 0,5" ${f}/>`;case 'plus':return `<path d="M3.6 0h2.8v3.6H10v2.8H6.4V10H3.6V6.4H0V3.6h3.6z" ${f}/>`;default:return `<rect x="0" y="3" width="10" height="4" rx="1.5" ${f}/>`}}
function bird(ci,{legs=true,streak=false,wingUp=false}={}){
  const p=PAL[ci];
  const wing=wingUp?`<path d="M11 19 Q15 4 24 10 Q20 17 11 19Z" fill="${p.dark}"/>`:`<path d="M10 20.5 Q17 13.5 24.5 20.5 Q17 27.5 10 20.5Z" fill="${p.dark}" opacity=".7"/>`;
  return `<g>${streak?`<g stroke="rgba(244,239,230,.5)" stroke-width="1.8" stroke-linecap="round"><line x1="-8" y1="17" x2="1" y2="17"/><line x1="-5" y1="25" x2="3" y2="25"/></g>`:''}
  ${legs?`<g stroke="#2E2116" stroke-width="1.6" stroke-linecap="round"><line x1="16" y1="29" x2="15" y2="34"/><line x1="21" y1="29" x2="21" y2="34"/></g>`:''}
  <polygon points="9.5,19.5 3,14 4,26.5" fill="${p.dark}"/><ellipse cx="18" cy="22" rx="11.2" ry="8.6" fill="${p.hex}"/>${wing}
  <circle cx="27.6" cy="15.4" r="7.2" fill="${p.hex}"/><polygon points="33.8,13.2 39.4,15.9 33.8,18.6" fill="#2E2116"/>
  <circle cx="29.7" cy="13.8" r="1.8" fill="#16110C"/><circle cx="30.2" cy="13.2" r=".6" fill="#fff"/>
  <g transform="translate(14.6 21.4) scale(.62)">${sym(p.sym,'rgba(255,255,255,.92)')}</g></g>`;
}
const F={
  land:{W:1920,H:1080,title:{x:120,y:118,size:250,align:'left'},
    wire:{x0:-60,y0:610,x1:1980,y1:520,sag:150},perch:{s:150,birds:[[0,.40,1],[2,.50,0],[5,.61,1],[1,.71,0],[4,.83,1]]},
    nest:{cx:1500,y:930,w:440,c:3,s:150},fly:[[0,1180,170,140,-12],[2,1560,250,118,-6]],hill:880,moon:[1700,120,70]},
  port:{W:800,H:1200,title:{x:400,y:96,size:168,align:'center'},
    wire:{x0:-40,y0:640,x1:840,y1:600,sag:90},perch:{s:112,birds:[[0,.17,0],[2,.36,1],[5,.55,0],[1,.72,1],[4,.87,0]]},
    nest:{cx:400,y:1060,w:330,c:3,s:112},fly:[[0,540,430,100,-12],[2,150,470,86,-6]],hill:980,moon:[680,70,44]},
  sq:{W:800,H:800,title:{x:400,y:58,size:138,align:'center'},
    wire:{x0:-40,y0:480,x1:840,y1:450,sag:70},perch:{s:96,birds:[[0,.19,0],[2,.37,1],[5,.55,0],[1,.71,1],[4,.86,0]]},
    nest:{cx:400,y:735,w:260,c:3,s:88},fly:[[0,610,318,78,-12]],hill:680,moon:[90,60,34]},
};
const f=F[new URLSearchParams(location.search).get('f')||'land'];
const c=document.getElementById('c');c.style.width=f.W+'px';c.style.height=f.H+'px';
const {W,H}=f;
// background, stars, glow, hills, wire drawn into one svg
const rnd=(s=>()=>((s=Math.imul(s^s>>>15,1|s)+0x6D2B79F5|0)>>>0)/4294967296)(42);
let stars='';for(let i=0;i<Math.round(W*H/9000);i++){const x=rnd()*W,y=rnd()*f.hill*.7,r=.6+rnd()*1.6;stars+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#F7F1E6" opacity="${.25+rnd()*.55}"/>`}
const w=f.wire,qx=(w.x0+w.x1)/2,qy=(w.y0+w.y1)/2+2*w.sag;
const pt=t=>({x:(1-t)**2*w.x0+2*(1-t)*t*qx+t*t*w.x1,y:(1-t)**2*w.y0+2*(1-t)*t*qy+t*t*w.y1});
const [mx,my,mr]=f.moon;
const hillPath=`M0 ${f.hill} C ${W*.2} ${f.hill-H*.06}, ${W*.35} ${f.hill+H*.02}, ${W*.55} ${f.hill-H*.03} S ${W*.85} ${f.hill-H*.07}, ${W} ${f.hill-H*.02} V ${H} H 0Z`;
const hill2=`M0 ${f.hill+H*.05} C ${W*.25} ${f.hill+H*.01}, ${W*.5} ${f.hill+H*.08}, ${W*.75} ${f.hill+H*.03} S ${W*.95} ${f.hill+H*.05}, ${W} ${f.hill+H*.04} V ${H} H 0Z`;
c.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="position:absolute;inset:0">
<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#112236"/><stop offset=".55" stop-color="#22465C"/><stop offset=".85" stop-color="#3C6170"/><stop offset="1" stop-color="#5A6E6A"/></linearGradient>
<radialGradient id="glow" cx=".5" cy="1" r=".8"><stop offset="0" stop-color="#F4C95D" stop-opacity=".38"/><stop offset=".5" stop-color="#EF8A5B" stop-opacity=".12"/><stop offset="1" stop-color="#EF8A5B" stop-opacity="0"/></radialGradient>
<radialGradient id="mg"><stop offset="0" stop-color="#F6E7B8" stop-opacity=".35"/><stop offset="1" stop-color="#F6E7B8" stop-opacity="0"/></radialGradient></defs>
<rect width="${W}" height="${H}" fill="url(#sky)"/><rect width="${W}" height="${H}" fill="url(#glow)"/>${stars}
<circle cx="${mx}" cy="${my}" r="${mr*2.4}" fill="url(#mg)"/>
<mask id="mm"><rect width="${W}" height="${H}" fill="#fff"/><circle cx="${mx-mr*.42}" cy="${my-mr*.18}" r="${mr*.9}" fill="#000"/></mask>
<circle cx="${mx}" cy="${my}" r="${mr}" fill="#F6E7B8" mask="url(#mm)"/>
<path d="${hillPath}" fill="#1A3242"/><path d="${hill2}" fill="#10212E"/>
<path d="M${w.x0} ${w.y0} Q ${qx} ${qy} ${w.x1} ${w.y1}" fill="none" stroke="#0A1620" stroke-width="${Math.max(4,f.perch.s*.045)}" stroke-linecap="round"/>
</svg>`;
function place(svg,x,y,s,{flip=false,rot=0}={}){
  const el=document.createElementNS('http://www.w3.org/2000/svg','svg');
  el.setAttribute('class','bird');el.setAttribute('viewBox','-10 0 52 40');
  el.style.width=(s*1.3)+'px';el.style.height=s+'px';el.style.left=(x-s*.25)+'px';el.style.top=y+'px';
  el.style.transform=`${flip?'scaleX(-1) ':''}rotate(${rot}deg)`;el.innerHTML=svg;c.appendChild(el);return el;
}
// perched birds: feet (x=18,y=34 in 40-unit box) sit on the wire
f.perch.birds.forEach(([ci,t,flip])=>{const p=pt(t),s=f.perch.s,u=s/40;place(bird(ci),p.x-18*u,p.y-34*u,s,{flip:!!flip})});
// nest with three birds of one colour
const n=f.nest,bh=n.w*30/132;
[-1,1,0].forEach(k=>{const s=n.s,u=s/40,x=n.cx+k*n.w*.3-18*u,y=n.y-bh*.15-30*u;place(bird(n.c,{legs:false}),x,y-(k===0?s*.1:0),s,{flip:k<0})});
const bowl=document.createElementNS('http://www.w3.org/2000/svg','svg');bowl.setAttribute('class','bowl');bowl.setAttribute('viewBox','0 0 132 30');
bowl.style.width=n.w+'px';bowl.style.height=bh+'px';bowl.style.left=(n.cx-n.w/2)+'px';bowl.style.top=(n.y-bh*.2)+'px';
bowl.innerHTML=`<path d="M4 6 Q66 40 128 6 Q118 28 66 28 Q14 28 4 6Z" fill="#5A4330"/><path d="M8 9 Q66 34 124 9" stroke="#7A5B40" stroke-width="2" fill="none"/><path d="M14 15 Q66 34 118 15" stroke="#7A5B40" stroke-width="2" fill="none"/><path d="M22 7 l10 16 M44 9 l6 17 M66 10 v18 M88 9 l-6 17 M110 7 l-10 16" stroke="#3E2D20" stroke-width="1.6"/><path d="M4 6 Q66 18 128 6" stroke="${PAL[n.c].hex}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
c.appendChild(bowl);
// flying birds heading toward the nest
f.fly.forEach(([ci,x,y,s,rot])=>place(bird(ci,{legs:false,streak:true,wingUp:true}),x,y,s,{rot}));
// title
const t=document.createElement('h1');t.className='title';const sz=f.title.size;
t.style.fontSize=sz+'px';t.style.setProperty('--sw',(sz*.075)+'px');t.style.setProperty('--sh',(sz*.035)+'px');
t.style.top=f.title.y+'px';
if(f.title.align==='center'){t.style.left='0';t.style.width=W+'px';t.style.textAlign='center'}else t.style.left=f.title.x+'px';
t.innerHTML='<span>Flock</span><span class="home">Home</span>';c.appendChild(t);
document.fonts.ready.then(()=>document.body.dataset.ready=1);
</script></body></html>
