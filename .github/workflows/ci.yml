name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - name: Upload playable build
        uses: actions/upload-artifact@v4
        with:
          name: flock-home-build
          path: dist/index.html
          retention-days: 30

  # Browser regression checks (tools/ui-check.py): layout at portal and phone sizes, dialogs,
  # daily puzzle, undo, eggs, fail and continue, page-vs-engine parity, and one check per fixed bug.
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - run: npm run build
      - run: npm run ui
