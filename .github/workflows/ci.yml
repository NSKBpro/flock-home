name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - name: Upload playable build
        uses: actions/upload-artifact@v4
        with:
          name: flock-home-build
          path: dist/index.html
          retention-days: 30
